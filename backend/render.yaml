# Render "Blueprint": tells Render how to build and run this backend (free plan).
# In Render: New → Blueprint → pick this GitHub repo. It reads this file.
services:
  - type: web
    name: messenger-ai-backend
    runtime: node
    plan: free # sleeps after 15 min without visitors; the first request wakes it (~1 minute)
    region: singapore
    branch: release/prod # deploys what's merged into release/prod
    # Install (including dev tools like the Nest CLI and Prisma), build the Prisma client, compile
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Bring the database tables up to date, then start
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production # also makes the app refuse to start without real secrets
      - key: FILE_STORAGE
        value: database # free hosts wipe their disk on restart, so uploads go in the database
      # Render invents these once and keeps them. Never change them afterwards:
      # a new MESSAGE_ENCRYPTION_KEY would make every stored message unreadable.
      - key: JWT_SECRET
        generateValue: true
      - key: MESSAGE_ENCRYPTION_KEY
        generateValue: true
      # Filled in by hand in the Render dashboard (sync: false = not stored in this file)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: FRONTEND_URL
        sync: false
